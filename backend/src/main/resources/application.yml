spring:
  application:
    name: smart-management-system

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/smartmgmt}
    username: ${DB_USERNAME:smartmgmt}
    password: ${DB_PASSWORD:smartmgmt}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: Smart Management System
    description: AI-Powered Management & Knowledge Platform

app:
  storage:
    documents-dir: ${DOCUMENTS_DIR:./uploads/documents}
    max-file-size-bytes: 26214400 # 25MB, keep in sync with spring.servlet.multipart.max-file-size

  ingest:
    enabled: true
    chunk-tokens: 600
    overlap-tokens: 90            # ~15% overlap
    max-chunks-per-document: 2000
    embedding-batch-size: 64
    dimensions: 1536              # must match vector(1536) in V6__document_chunks.sql
    worker-threads: 2
    queue-capacity: 100
    stale-processing-after: 10m
    openai:
      # Leave blank to use deterministic offline embeddings (no network, no cost).
      # Ignored while gemini.api-key below is set -- Gemini wins when both are present.
      api-key: ${OPENAI_API_KEY:}
      model: text-embedding-3-small
    gemini:
      # Preferred provider: set GEMINI_API_KEY and leave OPENAI_API_KEY blank.
      api-key: ${GEMINI_API_KEY:}
      model: gemini-embedding-001

  chat:
    context-chunks: 6
    history-turns: 20
    gemini:
      # Same key as app.ingest.gemini.api-key above -- one GEMINI_API_KEY, two uses.
      api-key: ${GEMINI_API_KEY:}
      model: gemini-3.8-flash
      temperature: 0.2
      max-output-tokens: 1024

  jwt:
    # HS256 signing key. MUST be overridden via JWT_SECRET outside local dev;
    # the app refuses to start if it is under 32 bytes (256 bits).
    secret: ${JWT_SECRET:dev-only-secret-do-not-use-in-production-change-me-1234567890}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    issuer: smart-management-system
