spring:
  application:
    name: smart-management-system

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/smartmgmt}
    username: ${DB_USERNAME:smartmgmt}
    password: ${DB_PASSWORD:smartmgmt}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: Smart Management System
    description: AI-Powered Management & Knowledge Platform
