<div class="container">
  <div class="page-header">
    <h1>{{ isEdit ? 'Edit customer' : 'New customer' }}</h1>
    <a class="btn" routerLink="/customers">Back</a>
  </div>

  <form class="card" [formGroup]="form" (ngSubmit)="save()">
    <div class="field">
      <label for="name">Name *</label>
      <input id="name" formControlName="name" />
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <span class="error">Name is required (max 200 chars).</span>
      }
    </div>

    <div class="field">
      <label for="company">Company</label>
      <input id="company" formControlName="company" />
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="error">Enter a valid email.</span>
      }
    </div>

    <div class="field">
      <label for="phone">Phone</label>
      <input id="phone" formControlName="phone" />
    </div>

    <div class="field">
      <label for="notes">Notes</label>
      <textarea id="notes" rows="4" formControlName="notes"></textarea>
    </div>

    @if (error()) { <p class="error">{{ error() }}</p> }

    <button class="btn btn-primary" type="submit">Save</button>
  </form>
</div>
